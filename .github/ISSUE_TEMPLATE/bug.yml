name: Bug report
description: Something in htTamer didn't work the way it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, and what went wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      placeholder: "1. Open …\n2. Press …"
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Filled in by htTamer (Tools → Feedback). No IP addresses, keys or names.
      render: text
