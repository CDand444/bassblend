# Checks on every push to main and every pull request, and before every release (release.yml calls
# this and only builds when it passes):
#   Linux, Python 3.13 (what the Pi runs): static check, all offline tests, and the browser check
#     (every page opened in headless Chromium with a real reload; fails on any script error).
#   Windows, Python 3.12 (the installed app): all offline tests.
# Nothing here needs hardware or plays sound.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: System libraries (PortAudio, for sounddevice)
        run: sudo apt-get update -q && sudo apt-get install -y -q libportaudio2
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes==3.4.0 playwright==1.56.0
      - name: Static check (pyflakes)
        run: python -m pyflakes subtune/
      - name: Offline tests
        run: for t in tests/test_*.py; do python "$t" > /dev/null || { echo "FAILED $t"; python "$t"; exit 1; }; done
      - name: Browser check (every page, real reloads)
        run: |
          python -m playwright install --with-deps chromium
          python tests/browser_check.py
          python tests/browser_actions.py
          python tests/browser_room_editor.py
          python tests/browser_analysis.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Offline tests
        shell: bash
        run: for t in tests/test_*.py; do python "$t" > /dev/null || { echo "FAILED $t"; python "$t"; exit 1; }; done
