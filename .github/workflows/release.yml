# Builds the Windows installer and attaches it to the GitHub release for a version tag (v1.2.3),
# but only after the checks in ci.yml pass (Linux + Windows tests, static check, browser check).
# The Raspberry Pi image is built separately (deploy/pi-gen/build-image.sh) and uploaded to the
# same release with: gh release upload v1.2.3 dist/bassblend-*.img.xz dist/bassblend-*.img.xz.sha256
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build for (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

env:
  MINIDSP_VERSION: "0.1.12"

jobs:
  checks:                                # the same checks as every push: nothing is built if they fail
    uses: ./.github/workflows/ci.yml

  windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VER=${TAG#v}" >> "$GITHUB_ENV"
          echo "${TAG#v}" > VERSION
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3 pyinstaller-hooks-contrib
      - name: miniDSP control tool
        shell: bash
        run: |
          mkdir -p tools/minidsp
          curl -fsSL -o md.zip "https://github.com/mrene/minidsp-rs/releases/download/v${MINIDSP_VERSION}/minidsp.x86_64-pc-windows-msvc.zip"
          unzip -o md.zip -d md && find md -name minidsp.exe -exec cp {} tools/minidsp/ \;
          test -f tools/minidsp/minidsp.exe
      - name: Offline tests
        shell: bash
        run: for t in tests/test_*.py; do python "$t" > /dev/null || { echo "FAILED $t"; python "$t"; exit 1; }; done
      - name: Bundle (PyInstaller)
        run: pyinstaller deploy/windows/httamer.spec --noconfirm
      - name: Smoke-test the bundle
        shell: bash
        run: ./dist/htTamer/htTamer.exe -m subtune --help > /dev/null
      - name: Installer (Inno Setup)
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$env:VER deploy\windows\httamer.iss'
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/htTamer-${{ env.VER }}-windows-setup.exe
          fail_on_unmatched_files: true
