<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up BassBlend</title>
<style>
:root {
  color-scheme: light;
  --bg: #f3f2ef; --surface: #fcfcfb; --surface-2: #f0efeb; --surface-3: #e8e6e1;
  --border: #e1dfd9; --text: #121211; --text-2: #4f4e4a; --text-3: #7a7974;
  --accent: #2a78d6; --accent-soft: #e4eefb; --good: #1f8a3a; --warn: #b26b00; --bad: #c4312d;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --surface-2: #222220; --surface-3: #2b2b29;
    --border: #2c2c29; --text: #f0efec; --text-2: #c3c2b9; --text-3: #8d8c85;
    --accent: #3987e5; --accent-soft: #1d2b3d; --good: #3fb15a; --warn: #d9932a; --bad: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --surface: #1a1a19; --surface-2: #222220; --surface-3: #2b2b29;
  --border: #2c2c29; --text: #f0efec; --text-2: #c3c2b9; --text-3: #8d8c85;
  --accent: #3987e5; --accent-soft: #1d2b3d; --good: #3fb15a; --warn: #d9932a; --bad: #e66767;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
header { margin-bottom: 22px; }
header .brand { font-weight: 700; font-size: 15px; color: var(--text-2); margin-bottom: 14px; }
h1 { font-size: 26px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -.01em; }
.lead { color: var(--text-2); margin: 0; max-width: 60ch; }
.progress { display: flex; gap: 6px; margin: 20px 0 0; }
.progress i { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-3); }
.progress i.done { background: var(--good); } .progress i.cur { background: var(--accent); }
.step { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; margin-top: 14px; }
.step.later { opacity: .55; }
.step .head { display: flex; gap: 12px; align-items: center; }
.step .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 700; font-size: 13px;
  background: var(--surface-3); color: var(--text-2); }
.step.done .n { background: var(--good); color: #fff; } .step.cur .n { background: var(--accent); color: #fff; }
.step h2 { font-size: 17px; margin: 0; flex: 1; }
.step .state { font-size: 12.5px; color: var(--text-3); }
.step.done .state { color: var(--good); font-weight: 600; }
.step .body { margin: 12px 0 0 40px; }
.step p { margin: 0 0 12px; color: var(--text-2); font-size: 14px; max-width: 58ch; }
.step.done .body, .step.later .body { display: none; }
.step.done.open .body { display: block; }
.imp { margin-top: 14px; padding: 14px 18px; border: 1px dashed var(--border); border-radius: 14px; display: flex; gap: 12px;
  align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--text-2); }
.imp b { color: var(--text-1); } .imp .grow { flex: 1 1 260px; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--text-2); margin-bottom: 10px; }
input[type=password], input[type=text] { height: 42px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg); color: var(--text);
  padding: 0 12px; font: inherit; font-size: 16px; width: 100%; max-width: 360px; }
input:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select { height: 42px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg); color: var(--text); padding: 0 10px; font: inherit; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { height: 40px; padding: 0 16px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.link { border: 0; background: none; color: var(--text-2); padding: 0 6px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
.btn:disabled { opacity: .55; cursor: default; }
.msg { font-size: 13.5px; margin: 10px 0 0; min-height: 1.2em; }
.msg.bad { color: var(--bad); } .msg.good { color: var(--good); }
.note { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--text-2); margin: 0 0 12px; max-width: 58ch; }
.found { display: grid; gap: 8px; margin: 0 0 12px; }
.found button { text-align: left; height: auto; padding: 10px 12px; }
.found small { display: block; color: var(--text-3); font-weight: 400; }
.finish { margin-top: 22px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: s .8s linear infinite; }
@keyframes s { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
@media (max-width: 520px) {
  h1 { font-size: 22px; } .step { padding: 16px; } .step .body { margin-left: 0; }
  .step .head { flex-wrap: wrap; row-gap: 2px; }
  .step h2 { flex: 1 1 0; min-width: 0; font-size: 16px; }
  .step .head .btn.link { order: 2; }
  .step .state { order: 3; flex-basis: 100%; padding-left: 40px; overflow-wrap: anywhere; }
}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">BassBlend</div>
    <h1 id="title">Welcome. Let’s set up BassBlend.</h1>
    <p class="lead" id="lead">Four short steps, about five minutes. Nothing here makes a sound, and you can change any of it later from the Setup checklist.</p>
    <div class="progress" id="progress" aria-hidden="true"></div>
  </header>
  <div id="imp"></div>
  <div id="steps"></div>
  <div class="finish" id="finish"></div>
</main>
<script>
try { const t = localStorage.getItem('subtune-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const post = (u, b) => fetch(u, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(b || {})})
  .then(async r => ({status: r.status, ...(await r.json().catch(() => ({error: 'BassBlend is not answering'})))}))
  .catch(() => ({error: 'BassBlend is not answering. Is it still switched on?'}));
let ST = null, open = null, skipped = {};
const busy = {};

async function load() {
  try { ST = await fetch('/api/setup/status').then(r => r.json()); } catch (e) { return; }
  if (ST.lan && ST.pin_set && !ST.signed_in) { location.href = '/login'; return; }
  render();
}

function steps() {
  const s = ST;
  return [
    {k: 'pin', title: 'Choose a PIN', done: !s.lan || s.pin_set,
     state: !s.lan ? 'Not needed on this computer' : s.pin_set ? 'Done' : '', body: pinBody},
    {k: 'mic', title: 'Add your mic’s calibration file', done: s.cal.ok || skipped.mic,
     state: s.cal.ok ? 'Done · ' + s.cal.name : skipped.mic ? 'Skipped' : '', body: micBody},
    {k: 'avr', title: 'Find your receiver', done: s.avr.configured || skipped.avr,
     state: s.avr.configured ? `Done · ${s.avr.make} ${s.avr.model || ''} at ${s.avr.host}` : skipped.avr ? 'Skipped' : '', body: avrBody},
    {k: 'ai', title: 'Turn on the AI assistant', optional: true, done: s.ai_key || skipped.ai,
     state: s.ai_key ? 'Done' : skipped.ai ? 'Skipped' : 'Optional', body: aiBody},
  ];
}

function render() {
  const list = steps(), cur = list.find(x => !x.done);
  $('#progress').innerHTML = list.map(x => `<i class="${x.done ? 'done' : x === cur ? 'cur' : ''}"></i>`).join('');
  $('#steps').innerHTML = list.map((x, i) => {
    const state = x.done ? 'done' : x === cur ? 'cur' : 'later';
    return `<section class="step ${state} ${open === x.k ? 'open' : ''}" aria-labelledby="h-${x.k}" ${x === cur ? 'aria-current="step"' : ''}>
      <div class="head"><span class="n" aria-hidden="true">${x.done ? '✓' : i + 1}</span><h2 id="h-${x.k}">${x.title}</h2>
        <span class="state">${esc(x.state)}</span>${x.done && x.k !== 'pin' ? `<button class="btn link" data-open="${x.k}">${open === x.k ? 'Close' : 'Change'}</button>` : ''}</div>
      <div class="body">${x === cur || open === x.k ? x.body() : ''}</div></section>`;
  }).join('');
  const allDone = !cur;
  const pinOk = list[0].done;
  $('#imp').innerHTML = pinOk && !allDone
    ? `<div class="imp"><span class="grow"><b>Set up BassBlend before?</b> Load your settings file (Settings file → Download, on the other device) and skip the rest.</span>
        <label class="btn">Import settings file<input type="file" id="impFile" accept=".json,application/json" hidden></label>
        <p class="msg" id="impMsg" role="alert" style="flex-basis:100%;margin:0"></p></div>`
    : '';
  $('#finish').innerHTML = pinOk
    ? `<button class="btn ${allDone ? 'primary' : ''}" id="go">${allDone ? 'Open BassBlend' : 'Finish later and open BassBlend'}</button>
       <span class="state" style="font-size:13px;color:var(--text-3)">${allDone ? 'Next: plug in the miniDSP and mic, then “Tune my system”.' : 'Anything left shows in the Setup checklist.'}</span>`
    : '';
  if (allDone) { $('#title').textContent = 'All set.'; $('#lead').textContent = 'BassBlend is ready. Your next step is the “Tune my system” guide on the main screen.'; }
  wire();
  const f = document.querySelector('.step.cur input:not([type=file])'); if (f && !document.activeElement.closest('.step')) f.focus();
}

// ---------- step bodies
function pinBody() {
  return `<p>Anyone on your home network can open BassBlend, and it can play loud test sweeps and change your miniDSP. A PIN keeps it to you.</p>
    <label class="f">PIN (6 or more characters)<input type="password" id="pin1" autocomplete="new-password"></label>
    <label class="f">Same PIN again<input type="password" id="pin2" autocomplete="new-password"></label>
    <div class="row"><button class="btn primary" id="pinSave">Save PIN</button></div>
    <p class="msg" id="pinMsg" role="alert"></p>
    <div class="note">Write it down somewhere safe. If you forget it, BassBlend can only be reset from a computer connected to it.</div>`;
}
function micBody() {
  return `<p>Your UMIK-1 came with a small text file that corrects its readings. BassBlend needs it for accurate measurements.</p>
    <div class="note">Don’t have it? Get it from miniDSP’s UMIK-1 page by entering the serial number printed on the mic (7 digits). Use the file ending in <b>_90deg.txt</b> if there are two.</div>
    <div class="row"><label class="btn primary">Choose file<input type="file" id="calFile" accept=".txt,.cal,.frd,text/plain" hidden></label>
      <button class="btn link" data-skip="mic">Skip for now</button></div>
    <p class="msg" id="calMsg" role="alert"></p>`;
}
function avrBody() {
  return `<p>BassBlend works with your receiver over the network: it reads its settings and plays the blend test through it. Make sure the receiver is plugged in and on the same network (it can be in standby).</p>
    <div class="row"><button class="btn primary" id="avrFind">Find my receiver</button><button class="btn link" data-skip="avr">Skip for now</button></div>
    <div id="avrOut" style="margin-top:12px"></div>
    <details style="margin-top:6px"><summary style="cursor:pointer;font-size:13.5px;color:var(--text-2)">Enter it by hand instead</summary>
      <div style="margin-top:10px">
        <label class="f">IP address (in the receiver’s Network menu)<input type="text" id="avrHost" inputmode="decimal" spellcheck="false" placeholder="192.168.1.50"></label>
        <label class="f">Brand<select id="avrMake" style="max-width:200px"><option>Onkyo</option><option>Integra</option><option>Pioneer</option></select></label>
        <label class="f">Model (optional)<input type="text" id="avrModel" placeholder="TX-RZ50"></label>
        <button class="btn" id="avrSave">Save receiver</button></div></details>
    <p class="msg" id="avrMsg" role="alert"></p>`;
}
function aiBody() {
  return `<p>The assistant explains results in plain words and can run tests for you (it always asks first). It needs an AI provider: an API key (billed by that provider per use), or a model you run yourself on another computer.</p>
    <div class="note">Claude works best with BassBlend. Keys: console.anthropic.com (Claude), platform.openai.com (OpenAI) or aistudio.google.com (Gemini). BassBlend keeps the key on this device only, sends it only to that provider, and picks a suitable model for you (you can change it later).</div>
    <label class="f">AI provider<select id="aiProv">
      <option value="anthropic">Anthropic (Claude), recommended</option><option value="openai">OpenAI</option>
      <option value="gemini">Google Gemini</option><option value="local">A local model on my network (Ollama, LM Studio)</option></select></label>
    <label class="f" id="aiBaseRow" hidden>Local server address<input type="text" id="aiBase" spellcheck="false" placeholder="http://192.168.1.20:11434/v1"></label>
    <label class="f" id="aiKeyRow">API key<input type="password" id="aiKey" autocomplete="off" spellcheck="false"></label>
    <div class="row"><button class="btn primary" id="aiSave">Save</button><button class="btn link" data-skip="ai">Skip, I’ll do this later</button></div>
    <p class="msg" id="aiMsg" role="alert"></p>`;
}

// ---------- actions
function wire() {
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { open = open === b.dataset.open ? null : b.dataset.open; render(); });
  document.querySelectorAll('[data-skip]').forEach(b => b.onclick = () => { skipped[b.dataset.skip] = true; open = null; render(); });
  const ps = $('#pinSave');
  if (ps) {
    const go = async () => {
      const a = $('#pin1').value, b = $('#pin2').value, m = $('#pinMsg');
      m.className = 'msg bad';
      if (a.length < 6) { m.textContent = 'Use at least 6 characters.'; return; }
      if (a !== b) { m.textContent = 'The two PINs don’t match.'; $('#pin2').select(); return; }
      ps.disabled = true;
      const r = await post('/api/setup/pin', {pin: a});
      ps.disabled = false;
      if (r.ok) { await load(); return; }
      m.textContent = r.error || 'That didn’t work.';
      if (r.status === 409) setTimeout(() => location.href = '/login', 1500);
    };
    ps.onclick = go; ['#pin1', '#pin2'].forEach(s => $(s).onkeydown = e => { if (e.key === 'Enter') go(); });
  }
  const cf = $('#calFile');
  if (cf) cf.onchange = async () => {
    const f = cf.files[0], m = $('#calMsg'); if (!f) return;
    if (f.size > 2e6) { m.className = 'msg bad'; m.textContent = 'That file is too big for a calibration file.'; return; }
    m.className = 'msg'; m.textContent = 'Checking…';
    const r = await post('/api/calfile', {name: f.name, text: await f.text()});
    if (r.error) { m.className = 'msg bad'; m.textContent = r.error; cf.value = ''; return; }
    open = null; await load();
  };
  const af = $('#avrFind');
  if (af) af.onclick = async () => {
    const o = $('#avrOut'), m = $('#avrMsg');
    af.disabled = true; m.textContent = ''; o.innerHTML = '<p class="row" style="color:var(--text-2);font-size:14px"><span class="spin"></span> Looking on your network (a few seconds)…</p>';
    const r = await post('/api/avr', {action: 'discover'});
    af.disabled = false;
    if (r.error) {
      o.innerHTML = ''; m.className = 'msg bad';
      m.textContent = 'No receiver answered. Check it’s plugged in and on the same network, then try again, or enter its address by hand below.';
      return;
    }
    open = null; await load();
  };
  const as = $('#avrSave');
  if (as) as.onclick = async () => {
    const m = $('#avrMsg');
    const r = await post('/api/avr', {action: 'configure', host: $('#avrHost').value.trim(), make: $('#avrMake').value, model: $('#avrModel').value.trim()});
    if (r.error) { m.className = 'msg bad'; m.textContent = r.error; return; }
    open = null; await load();
  };
  const ak = $('#aiSave');
  if (ak) {
    const go = async () => {
      const prov = $('#aiProv').value, m = $('#aiMsg');
      m.className = 'msg'; m.textContent = 'Checking…';
      const r = await post('/api/ai', {action: 'save', provider: prov, key: $('#aiKey').value.trim() || undefined,
                                       local_base: prov === 'local' ? $('#aiBase').value.trim() : undefined});
      if (!r.error && !r.ready) { m.className = 'msg bad'; m.textContent = prov === 'local' ? 'Enter the server address.' : 'Enter the API key.'; return; }
      if (r.error) { m.className = 'msg bad'; m.textContent = r.error; return; }
      open = null; await load();
    };
    ak.onclick = go; $('#aiKey').onkeydown = e => { if (e.key === 'Enter') go(); };
    $('#aiProv').onchange = () => { const local = $('#aiProv').value === 'local';
      $('#aiBaseRow').hidden = !local; $('#aiKeyRow').firstChild.textContent = local ? 'API key (only if your server needs one)' : 'API key'; };
  }
  const imf = $('#impFile');
  if (imf) imf.onchange = async () => {
    const f = imf.files[0], m = $('#impMsg'); if (!f) return;
    let b = null;
    try { b = JSON.parse(await f.text()); } catch (e) {}
    if (!b || b.format !== 'bassblend-config') { m.className = 'msg bad'; m.textContent = 'That isn’t a BassBlend settings file.'; imf.value = ''; return; }
    m.className = 'msg'; m.textContent = 'Importing…';
    const r = await post('/api/config/import', {bundle: b});
    if (r.error) { m.className = 'msg bad'; m.textContent = r.error; imf.value = ''; return; }
    open = null; await load();
    const done = $('#impMsg') || $('#finish');
    if (done) { const n = document.createElement('p'); n.className = 'msg'; n.style.color = 'var(--good)';
      n.textContent = 'Imported: ' + r.imported.join(' · '); $('#finish').prepend(n); }
  };
  const g = $('#go');
  if (g) g.onclick = async () => { g.disabled = true; await post('/api/setup/done'); location.href = '/'; };
}
load();
</script>
</body>
</html>
